<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ meta.title }}{% endblock %}</title>
    <meta
      name="description"
      content="{{ meta.description }}"
    />
    <link rel="canonical" href="{{ meta.canonical_url }}" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ content.site_name }}" />
    <meta property="og:title" content="{{ meta.title }}" />
    <meta property="og:description" content="{{ meta.description }}" />
    <meta property="og:url" content="{{ meta.canonical_url }}" />
    <meta property="og:image" content="{{ meta.og_image }}" />
    <meta property="og:locale" content="es_CL" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ meta.title }}" />
    <meta name="twitter:description" content="{{ meta.description }}" />
    <meta name="twitter:image" content="{{ meta.og_image }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}" />
    {% if meta.page_key == "home" %}<link rel="preload" as="image" href="{{ content.hero.intro_logo }}" fetchpriority="high" />{% endif %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v={{ content.asset_version }}" />
    {% block structured_data %}{% endblock %}
  </head>
  <body data-page-key="{{ meta.page_key }}">
    <div class="site-wrapper">
    {% include "partials/whatsapp_float.html" %}
    {% include "partials/header.html" %}
    {% block body %}{% endblock %}
    {% include "partials/footer.html" %}
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}?v={{ content.asset_version }}" defer></script>
  </body>
</html>
